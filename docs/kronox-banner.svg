    <rect width="128" height="36" rx="18" fill="#173c65" stroke="#48c9f4" stroke-opacity=".6"/><text x="20" y="23" fill="#baf4ff">✦ EXPLORA</text>
    <rect x="142" width="128" height="36" rx="18" fill="#173c65" stroke="#48c9f4" stroke-opacity=".6"/><text x="162" y="23" fill="#baf4ff">↗ PILOTA</text>
    <rect x="284" width="138" height="36" rx="18" fill="#173c65" stroke="#48c9f4" stroke-opacity=".6"/><text x="304" y="23" fill="#baf4ff">◉ INVESTIGA</text>
  </g>
</svg>