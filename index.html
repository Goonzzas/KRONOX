<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Explora el sistema solar en 3D con Kronox, tu guía astral." />
    <title>KRONOX · Explorador 3D</title>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#030712;color:#38bdf8;font-family:system-ui,-apple-system,sans-serif;flex-direction:column;gap:12px;">
        <div style="width:36px;height:36px;border:3px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:kronoxSpin 0.9s linear infinite;"></div>
        <span style="font-size:12px;letter-spacing:0.12em;color:#94a3b8;font-weight:600;text-transform:uppercase;">Cargando Observatorio KRONOX...</span>
        <style>@keyframes kronoxSpin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
